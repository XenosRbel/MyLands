name: Game quality gate

on:
  push:
    branches: [main, improve/**]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster art renderer
        run: python -m pip install 'Pillow>=10,<13'
      - run: npm ci
      - run: npm run check:art
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Validate game packs
        run: go run ./cmd/packtool summary ../packs/*/
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build --progress=plain -t mylands:ci .
