openapi: 3.1.0
info:
  title: Realmforge Game API
  version: 0.1.0
  description: |
    Server-authoritative REST API. Envelope: success `{"data": ...}`, failure `{"error": {"code", "message", "details?"}}`.
    State-changing game commands (marked x-idempotent) REQUIRE an `Idempotency-Key` header (8-80 chars [A-Za-z0-9_-]);
    duplicates replay the stored response byte-for-byte with header `Idempotent-Replay: true`; reusing a key for a different body returns 422.
    Generated by server/api/gen_openapi.py; route coverage is enforced by internal/api/openapi_test.go.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,80}$'}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {}
    Data:
      type: object
      properties:
        data: {}
  responses:
    BadRequest:
      description: Invalid request / JSON / missing idempotency key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (also returned for other players' resources)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State conflict (e.g. already claimed, order closed)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: Game rule violation (e.g. insufficient_resources) or idempotency key reuse
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooMany:
      description: Rate limited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
paths:
  /healthz:
    get:
      tags: [ops]
      summary: "Liveness"
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Data'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooMany'}
